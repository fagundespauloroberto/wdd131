<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Produto</title>
  <meta name="description" content="Exercicio semana 05 - Formulário de avaliação de produto para WDD 131">
  <meta name="author" content="Paulo Fagundes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400;700&family=Great+Vibes&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="estilos/formulario.css">
  <script defer src="scripts/formulario.js"></script>
  <script src="scripts/getdates.js" defer></script>
  <script src="scripts/getdates.js" defer></script>

</head>

<body>
  <header>
    <h1>Avaliação de Produto</h1>
    
  </header>
  <main>
    <form action="avaliacao.html" method="get">

      <div class="item">
        <label for="product_name">Nome do Produto</label>
        <select id="product_name" name="product_name" required>
          <option value="" selected disabled>Selecione um Produto...</option>
          <!-- ajustes para testes e validações
          <option value="product1">Produto 01</option>
          <option value="product2">Produto 02</option>
          <option value="product3">Produto 03</option>
        -->
        </select>
      </div>

      <div class="item">
        <p>Avaliação Geral</p>
        <div class="radio-group">
          <input type="radio" id="overall-1" name="overall" value="1" required>
          <label for="overall-1">&star;</label>

          <input type="radio" id="overall-2" name="overall" value="2" required>
          <label for="overall-2">&star;&star;</label>

          <input type="radio" id="overall-3" name="overall" value="3" required>
          <label for="overall-3">&star;&star;&star;</label>

          <input type="radio" id="overall-4" name="overall" value="4" required>
          <label for="overall-4">&star;&star;&star;&star;</label>

          <input type="radio" id="overall-5" name="overall" value="5" required>
          <label for="overall-5">&star;&star;&star;&star;&star;</label>
        </div>
      </div>

      <div class="item">
        <label>Data de Instalação</label>
          <input type="date" id="install" name="install" required>
      </div>

      <div class="item">
        <p>Quais recursos você achou úteis no produto?<br>
          <em>(Marque todos os que se aplicam)</em>
        </p>
        <div class="checkbox-group">
          <input type="checkbox" id="durablility" name="durability" value="durability">
          <label for="durablility">Durabilidade</label>
          <input type="checkbox" id="ease" name="ease" value="ease">
          <label for="ease">Facilidade de Uso</label>
          <input type="checkbox" id="performance" name="performance" value="performance">
          <label for="performance">Desempenho</label>
          <input type="checkbox" id="design" name="design" value="design">
          <label for="design">Design</label>
        </div>
      </div>

      <div class="item">
        <label for="review">Avaliação Escrita <span class="smaller">(Opcional)</span></label>
        <textarea id="review" name="review"></textarea>
      </div>

      <div class="item">
        <label for="user">Seu Nome <span class="smaller">(Opcional)</span></label>
        <input type="text" id="user" name="user">
      </div>

      <input type="submit" value="Publicar Avaliação">

    </form>
  </main>
    <footer>
        <p>&copy; <span id="ano-atual"></span> (❖): Paulo Fagundes (❖): Xaxim, Santa Catarina, Brasil</p>
        <p>Última modificação: <span id="ultima-modificacao"></span></p>
    </footer>
</body>

</html>
